<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Game Playable Mockup v3 - FastAPI Learning Bridge</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2d241d}
#game{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="game" src="playable_mockup_v2.html" title="Cat Game Playable Prototype v3"></iframe>
<script>
(()=>{
 const API='http://127.0.0.1:8000';
 const frame=document.getElementById('game');
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 async function until(fn,limit=10000){const t=performance.now();while(performance.now()-t<limit){const v=fn();if(v)return v;await wait(50)}throw new Error('v3 init timeout')}
 frame.addEventListener('load',async()=>{
  try{
   const d=frame.contentDocument;
   const study=await until(()=>d.getElementById('study'));
   const card=study.querySelector('.card');
   const oldBtn=study.querySelector('[data-demo="study"]');
   const oldStatus=d.getElementById('studyStatus');
   if(!card||!oldBtn||!oldStatus)return;

   oldBtn.removeAttribute('data-demo');
   oldBtn.dataset.apiSubmit='1';
   oldBtn.textContent='FastAPI에 제출';
   oldStatus.textContent='백엔드 연결 확인 중…';

   const box=d.createElement('div');
   box.style.cssText='margin:12px 0;padding:12px;border:2px solid #b27b4e;border-radius:14px;background:#fffaf0';
   box.innerHTML=`
     <b>FastAPI 학습 연결</b>
     <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
       <button id="apiReload" class="tiny">/tasks 다시 불러오기</button>
       <span id="apiState">확인 중…</span>
     </div>
     <label style="display:block;margin-top:8px">실제 사용자 UUID
       <input id="apiUser" placeholder="DB에 존재하는 user UUID" style="width:100%;padding:7px;margin-top:4px">
     </label>
     <label style="display:block;margin-top:8px">제출 코드
       <textarea id="apiCode" rows="4" style="width:100%;padding:7px;margin-top:4px;font-family:monospace">print("Hello, Python!")</textarea>
     </label>
     <div id="apiTask" style="margin-top:8px">Task: 불러오는 중…</div>
     <div style="margin-top:6px;font-size:12px;opacity:.7">실제 채점 연결 전이므로 서버 응답은 PENDING일 수 있습니다. DEMO 보상은 이 버튼에서 지급하지 않습니다.</div>`;
   card.insertBefore(box,oldBtn);

   const apiState=box.querySelector('#apiState'),apiTask=box.querySelector('#apiTask'),user=box.querySelector('#apiUser'),code=box.querySelector('#apiCode');
   let tasks=[],selected=null;
   user.value=localStorage.getItem('catGameApiUserId')||'';
   user.addEventListener('change',()=>localStorage.setItem('catGameApiUserId',user.value.trim()));

   async function loadTasks(){
     apiState.textContent='연결 중…';
     try{
       const root=await fetch(API+'/');
       if(!root.ok)throw new Error('root '+root.status);
       const res=await fetch(API+'/tasks');
       if(!res.ok)throw new Error('/tasks '+res.status);
       tasks=await res.json();selected=tasks[0]||null;
       apiState.textContent='🟢 FastAPI 연결됨 · tasks '+tasks.length;
       apiTask.textContent=selected?`Task: ${selected.id} · ${selected.type} · ${selected.difficulty}`:'Task: 활성 문제가 없습니다.';
       if(selected&&selected.template_code)code.value=selected.template_code;
       oldStatus.textContent='실제 /tasks 조회 성공. 사용자 UUID 입력 후 제출할 수 있습니다.';
     }catch(err){
       apiState.textContent='🔴 FastAPI 미연결';
       apiTask.textContent='Task: 서버를 먼저 실행하세요.';
       oldStatus.textContent='백엔드가 꺼져 있습니다. 기존 DEMO 화면은 계속 사용할 수 있습니다.';
     }
   }
   box.querySelector('#apiReload').addEventListener('click',e=>{e.preventDefault();loadTasks()});
   oldBtn.addEventListener('click',async e=>{
     e.preventDefault();e.stopPropagation();
     if(!selected){oldStatus.textContent='먼저 /tasks를 불러와야 합니다.';return}
     const uid=user.value.trim();
     if(!uid){oldStatus.textContent='실제 DB 사용자 UUID를 입력하세요.';return}
     oldBtn.disabled=true;oldStatus.textContent='POST /attempts 전송 중…';
     try{
       const res=await fetch(API+'/attempts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,task_id:selected.id,submitted_code:code.value,used_hint:false})});
       const data=await res.json().catch(()=>({}));
       if(!res.ok){oldStatus.textContent=`서버 오류 ${res.status}: ${data.detail||'요청 실패'}`;return}
       oldStatus.textContent=`✅ 실제 attempt 생성 · ${data.attempt_id} · status=${data.status}`;
     }catch(err){oldStatus.textContent='FastAPI 연결 실패: '+err.message}
     finally{oldBtn.disabled=false}
   },true);
   loadTasks();
  }catch(err){console.error(err)}
 });
})();
</script>
</body>
</html>
