<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Game Playable Mockup v9 - Real Cat Assets</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2d241d}#game{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="game" src="playable_mockup_v8.html" title="Cat Game Playable Prototype v9"></iframe>
<script>
(()=>{
 const frame=document.getElementById('game');
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 async function until(fn,limit=18000){const t=performance.now();while(performance.now()-t<limit){const v=fn();if(v)return v;await wait(60)}throw new Error('v9 init timeout')}
 frame.addEventListener('load',async()=>{
  try{
   const d8=frame.contentDocument;
   const f7=await until(()=>d8&&d8.getElementById('game'));
   const d7=f7.contentDocument;
   const f6=await until(()=>d7&&d7.getElementById('game'));
   const d6=f6.contentDocument;
   const f5=await until(()=>d6&&d6.getElementById('game'));
   const d5=f5.contentDocument;
   const f4=await until(()=>d5&&d5.getElementById('game'));
   const d4=f4.contentDocument;
   const f3=await until(()=>d4&&d4.getElementById('game'));
   const d3=f3.contentDocument;
   const f2=await until(()=>d3&&d3.getElementById('game'));
   const d=f2.contentDocument;
   const house=await until(()=>d&&d.getElementById('house'));
   const houseOuter=house.querySelector('iframe');
   const cat=await until(()=>{
     const dh4=houseOuter&&houseOuter.contentDocument;
     const fh3=dh4&&dh4.getElementById('game');
     const dh3=fh3&&fh3.contentDocument;
     const fh2=dh3&&dh3.getElementById('game');
     const dh2=fh2&&fh2.contentDocument;
     const fh1=dh2&&dh2.getElementById('game');
     const dh1=fh1&&fh1.contentDocument;
     return dh1&&dh1.getElementById('catV2');
   });
   if(!house||!cat)return;

   const r=await fetch('cat_sprite_manifest.json',{cache:'no-store'});
   const manifest=r.ok?await r.json():{default:{source:'inherited',label:'orange-tabby-reference'},cats:{}};
   const original={
     backgroundImage:cat.style.backgroundImage,
     backgroundSize:cat.style.backgroundSize,
     backgroundRepeat:cat.style.backgroundRepeat,
     backgroundPosition:cat.style.backgroundPosition,
     aspectRatio:cat.style.aspectRatio,
     width:cat.style.width,
     filter:cat.style.filter
   };

   const old=house.querySelector('.appearancePreview');if(old)old.remove();
   const style=d.createElement('style');
   style.textContent=`.realAssetPreview{position:absolute;left:50%;bottom:2%;z-index:10050;transform:translateX(-50%);padding:9px 12px;border:2px solid #704323;border-radius:18px;background:#fff1d9f2;box-shadow:0 8px 22px #0003;font-weight:900;text-align:center}.realAssetPreview .row{display:flex;gap:7px;justify-content:center;margin-top:6px}.realAssetPreview button.active{background:#ffd27a}.realAssetPreview small{display:block;margin-top:5px;opacity:.72}`;
   d.head.append(style);
   const box=d.createElement('div');box.className='realAssetPreview';
   box.innerHTML=`<div>🐾 실제 캐릭터 자산 미리보기</div><div class="row"><button class="tiny" data-real-cat="1">🟠 주황</button><button class="tiny" data-real-cat="2">⚫ 검정</button><button class="tiny" data-real-cat="3">⚪ 흰색</button></div><small id="realAssetState">실제 WebP walk strip 확인</small>`;
   house.append(box);
   const state=box.querySelector('#realAssetState');

   function reset(){
     cat.style.backgroundImage=original.backgroundImage;
     cat.style.backgroundSize=original.backgroundSize;
     cat.style.backgroundRepeat=original.backgroundRepeat;
     cat.style.backgroundPosition=original.backgroundPosition;
     cat.style.aspectRatio=original.aspectRatio;
     cat.style.width=original.width;
     cat.style.filter=original.filter;
   }
   function apply(catId){
     reset();
     const entry=catId===1?manifest.default:(manifest.cats&&manifest.cats[String(catId)]);
     if(entry&&entry.source==='file'&&entry.url){
       const frames=Math.max(1,Number(entry.frames||1));
       cat.style.backgroundImage=`url("${entry.url}")`;
       cat.style.backgroundRepeat='no-repeat';
       cat.style.backgroundSize=entry.layout==='vertical'?`100% ${frames*100}%`:`${frames*100}% 100%`;
       cat.style.backgroundPosition='0 0';
       cat.style.filter='none';
       if(entry.aspectRatio)cat.style.aspectRatio=entry.aspectRatio;
       if(entry.width)cat.style.width=entry.width;
     }
     box.querySelectorAll('[data-real-cat]').forEach(b=>b.classList.toggle('active',Number(b.dataset.realCat)===catId));
     state.textContent=`cat_id=${catId} · ${entry&&entry.label||'default'}${entry&&entry.source==='file'?' · REAL ASSET':' · inherited'}`;
   }
   box.addEventListener('click',e=>{const b=e.target.closest('[data-real-cat]');if(!b)return;e.preventDefault();e.stopPropagation();apply(Number(b.dataset.realCat))});
   apply(1);
  }catch(err){console.error(err)}
 });
})();
</script>
</body>
</html>
