<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Game Playable Mockup v8 - Cat Appearance Preview</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2d241d}#game{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="game" src="playable_mockup_v7.html" title="Cat Game Playable Prototype v8"></iframe>
<script>
(()=>{
 const frame=document.getElementById('game');
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 async function until(fn,limit=16000){const t=performance.now();while(performance.now()-t<limit){const v=fn();if(v)return v;await wait(60)}throw new Error('v8 init timeout')}
 frame.addEventListener('load',async()=>{
  try{
   const d7=frame.contentDocument;
   const f6=await until(()=>d7&&d7.getElementById('game'));
   const d6=f6.contentDocument;
   const f5=await until(()=>d6&&d6.getElementById('game'));
   const d5=f5.contentDocument;
   const f4=await until(()=>d5&&d5.getElementById('game'));
   const d4=f4.contentDocument;
   const f3=await until(()=>d4&&d4.getElementById('game'));
   const d3=f3.contentDocument;
   const f2=await until(()=>d3&&d3.getElementById('game'));
   const d=f2.contentDocument;
   const house=await until(()=>d&&d.getElementById('house'));
   const houseOuter=house.querySelector('iframe');
   const cat=await until(()=>{
     const dh4=houseOuter&&houseOuter.contentDocument;
     const fh3=dh4&&dh4.getElementById('game');
     const dh3=fh3&&fh3.contentDocument;
     const fh2=dh3&&dh3.getElementById('game');
     const dh2=fh2&&fh2.contentDocument;
     const fh1=dh2&&dh2.getElementById('game');
     const dh1=fh1&&fh1.contentDocument;
     return dh1&&dh1.getElementById('catV2');
   });
   if(!house||!cat)return;

   const r=await fetch('cat_sprite_manifest.json',{cache:'no-store'});
   const manifest=r.ok?await r.json():{default:{label:'orange-tabby-reference'},cats:{}};
   const originalFilter=cat.style.filter;

   const style=d.createElement('style');
   style.textContent=`.appearancePreview{position:absolute;left:50%;bottom:2%;z-index:10040;transform:translateX(-50%);padding:9px 12px;border:2px solid #704323;border-radius:18px;background:#fff1d9ef;box-shadow:0 8px 22px #0003;font-weight:900;text-align:center}.appearancePreview .row{display:flex;gap:7px;justify-content:center;margin-top:6px}.appearancePreview button.active{background:#ffd27a}.appearancePreview small{display:block;margin-top:5px;opacity:.72}`;
   d.head.append(style);
   const box=d.createElement('div');box.className='appearancePreview';
   box.innerHTML=`<div>🎨 캐릭터 외형 미리보기</div><div class="row"><button class="tiny" data-preview-cat="1">🟠 주황</button><button class="tiny" data-preview-cat="2">⚫ 검정</button><button class="tiny" data-preview-cat="3">⚪ 흰색</button></div><small id="appearancePreviewState">DB 선택과 별개인 개발용 미리보기</small>`;
   house.append(box);
   const state=box.querySelector('#appearancePreviewState');

   function preview(catId){
     const entry=catId===1?manifest.default:(manifest.cats&&manifest.cats[String(catId)]);
     cat.style.filter=entry&&entry.filter?entry.filter:originalFilter;
     box.querySelectorAll('[data-preview-cat]').forEach(b=>b.classList.toggle('active',Number(b.dataset.previewCat)===catId));
     state.textContent=`preview cat_id=${catId} · ${entry&&entry.label||'default'}`;
   }
   box.addEventListener('click',e=>{const b=e.target.closest('[data-preview-cat]');if(!b)return;e.preventDefault();e.stopPropagation();preview(Number(b.dataset.previewCat))});
   preview(1);
  }catch(err){console.error(err)}
 });
})();
</script>
</body>
</html>
