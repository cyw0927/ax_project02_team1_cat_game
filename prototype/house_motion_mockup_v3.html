<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat House Motion Prototype v3</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2d241d}#game{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="game" src="house_motion_mockup_v2.html" title="하우스 생활 행동 프로토타입"></iframe>
<script>
(()=>{
  const outer=document.getElementById('game');
  const waitFor=(fn,cb)=>{const id=setInterval(()=>{const v=fn();if(v){clearInterval(id);cb(v)}},50)};
  outer.addEventListener('load',()=>{
    waitFor(()=>{
      const d2=outer.contentDocument;
      const inner=d2&&d2.getElementById('game');
      const d=inner&&inner.contentDocument;
      const cat=d&&d.getElementById('catV2');
      const state=d&&d.getElementById('stateText');
      return cat&&state?{d,cat,state}:null;
    },({d,cat,state})=>{
      const stage=d.getElementById('stage');
      const panel=d.getElementById('panel');
      const badge=d.getElementById('badge');
      const debug=d.getElementById('debug');
      if(!stage||!panel||!badge)return;

      const behaviorText=d.createElement('b');
      behaviorText.textContent='IDLE';
      if(debug)debug.append(' · behavior: ',behaviorText);

      const lifeBtn=d.createElement('button');
      lifeBtn.textContent='생활모드 ON';
      panel.append(lifeBtn);

      const blink=d.createElement('div');
      Object.assign(blink.style,{position:'absolute',left:'15%',top:'25%',width:'47%',height:'21%',opacity:'0',pointerEvents:'none',zIndex:'3'});
      blink.innerHTML='<i></i><i></i>';
      const style=d.createElement('style');
      style.textContent=`#catV2{transition:filter .18s ease}#catV2 .v3blink i{position:absolute;top:45%;width:27%;height:14%;border-top:3px solid #3a2418;border-radius:50%;background:#f3c47d99}#catV2 .v3blink i:first-child{left:4%}#catV2 .v3blink i:last-child{right:4%}`;
      d.head.append(style);
      blink.className='v3blink';
      cat.append(blink);

      let life=true,idleTimer=null,walkTimer=null,seq=0;
      const sleep=ms=>new Promise(r=>setTimeout(r,ms));
      function cancelBehavior(){seq++;clearTimeout(idleTimer);blink.style.opacity='0';cat.style.rotate='';cat.style.translate='';cat.style.scale='';cat.style.filter='drop-shadow(0 6px 5px #4b2d1888)';behaviorText.textContent=state.textContent==='WALK'?'WALK':'IDLE'}
      async function behavior(type){
        const token=++seq;
        if(!life||state.textContent!=='IDLE')return;
        behaviorText.textContent=type;
        if(type==='BLINK'){
          blink.style.opacity='1';await sleep(150);if(token!==seq)return;blink.style.opacity='0';
        }else if(type==='LOOK'){
          const left=Math.random()<.5;cat.style.rotate=left?'-3deg':'3deg';cat.style.translate=left?'-3px 0':'3px 0';await sleep(620);if(token!==seq)return;cat.style.rotate='';cat.style.translate='';
        }else if(type==='BREATHE'){
          cat.style.scale='1 1.025';await sleep(420);if(token!==seq)return;cat.style.scale='';
        }else if(type==='WIGGLE'){
          const a=cat.animate([{rotate:'0deg'},{rotate:'-2deg'},{rotate:'2deg'},{rotate:'-1deg'},{rotate:'0deg'}],{duration:620,easing:'ease-in-out'});await a.finished.catch(()=>{});if(token!==seq)return;
        }else if(type==='HAPPY'){
          const a=cat.animate([{translate:'0 0',scale:'1'},{translate:'0 -8px',scale:'1.04'},{translate:'0 0',scale:'1'}],{duration:520,easing:'ease-out'});await a.finished.catch(()=>{});if(token!==seq)return;
        }
        behaviorText.textContent='IDLE';
      }
      function scheduleIdle(){
        clearTimeout(idleTimer);
        if(!life||state.textContent!=='IDLE')return;
        idleTimer=setTimeout(async()=>{
          if(!life||state.textContent!=='IDLE')return;
          const list=['BLINK','BLINK','LOOK','BREATHE','WIGGLE','HAPPY'];
          await behavior(list[Math.floor(Math.random()*list.length)]);
          scheduleIdle();
        },1400+Math.random()*2200);
      }
      const safePoints=[[60,77],[34,72],[68,78],[43,69],[58,84],[28,67]];
      function oneAutoWalk(){
        if(!life||state.textContent!=='IDLE')return;
        const p=safePoints[Math.floor(Math.random()*safePoints.length)];
        const r=stage.getBoundingClientRect();
        stage.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,clientX:r.left+r.width*p[0]/100,clientY:r.top+r.height*p[1]/100,pointerId:7,pointerType:'mouse'}));
      }
      function scheduleWalk(){
        clearTimeout(walkTimer);
        if(!life)return;
        walkTimer=setTimeout(()=>{oneAutoWalk();scheduleWalk()},7000+Math.random()*6000);
      }
      function stateChanged(){
        if(state.textContent==='WALK')cancelBehavior();
        else if(life)scheduleIdle();
      }
      new MutationObserver(stateChanged).observe(state,{childList:true,subtree:true,characterData:true});
      lifeBtn.addEventListener('click',e=>{
        e.stopPropagation();life=!life;lifeBtn.textContent=life?'생활모드 ON':'생활모드 OFF';
        if(life){scheduleIdle();scheduleWalk()}else{cancelBehavior();clearTimeout(walkTimer)}
      });
      badge.textContent='생활모드: 가만히 있을 때 눈 깜빡임 · 두리번 · 숨쉬기 · 기쁨 · 가끔 자동 산책 🐾';
      scheduleIdle();scheduleWalk();
    });
  });
})();
</script>
</body>
</html>
