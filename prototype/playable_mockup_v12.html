<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Game Playable Mockup v12 - DB Multi Cat House</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2d241d}#game{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="game" src="playable_mockup_v9.html" title="Cat Game Playable Prototype v12"></iframe>
<script>
(()=>{
 const API='http://127.0.0.1:8000';
 const frame=document.getElementById('game');
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 async function until(fn,limit=20000){const t=performance.now();while(performance.now()-t<limit){const v=fn();if(v)return v;await wait(60)}throw new Error('v12 init timeout')}
 frame.addEventListener('load',async()=>{
  try{
   let d=frame.contentDocument;
   for(let i=0;i<7;i++){const f=await until(()=>d&&d.getElementById('game'));d=f.contentDocument}
   const stage=await until(()=>d&&d.getElementById('stage'));
   const baseCat=d.getElementById('catV2');
   const house=d.getElementById('house');
   const userInput=d.getElementById('catUser');
   const loadBtn=d.getElementById('catLoad');
   if(!stage||!baseCat||!house)return;
   baseCat.style.display='none';

   const P=[{x:15.5,y:61.5},{x:34,y:43},{x:49,y:37},{x:72,y:43.5},{x:82,y:59},{x:81,y:65},{x:50,y:91},{x:15,y:65}];
   const O=[[18,54,30,64.5],[34,43,48,52],[31,51,37,59],[45,54,57,62],[46,33,55,41],[58,42,67,50],[67,48,74,55],[65,56,80,69],[41,76,55,88],[38,57,44,66],[55,64,63,73]];
   const pad={x:.8,y:1};
   function pip(p){let z=false;for(let i=0,j=P.length-1;i<P.length;j=i++)if(((P[i].y>p.y)!=(P[j].y>p.y))&&(p.x<(P[j].x-P[i].x)*(p.y-P[i].y)/((P[j].y-P[i].y)||1e-9)+P[i].x))z=!z;return z}
   function walkable(p){return pip(p)&&!O.some(o=>p.x>=o[0]-pad.x&&p.x<=o[2]+pad.x&&p.y>=o[1]-pad.y&&p.y<=o[3]+pad.y)}
   function safeFromCats(p,self,cats,min=7){return cats.every(c=>c===self||Math.hypot((c.pos.x-p.x)*1.6,c.pos.y-p.y)>=min)}
   function randomPoint(self,cats){for(let i=0;i<600;i++){const p={x:16+Math.random()*65,y:39+Math.random()*50};if(walkable(p)&&safeFromCats(p,self,cats,8))return p}return{x:50,y:72}}
   function clear(a,b){const m=Math.max(3,Math.ceil(Math.hypot((a.x-b.x)*1.7,a.y-b.y)*1.2));for(let i=0;i<=m;i++){const t=i/m;if(!walkable({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}))return false}return true}
   function detour(a,b){if(clear(a,b))return[b];for(let i=0;i<240;i++){const p={x:16+Math.random()*65,y:39+Math.random()*50};if(walkable(p)&&clear(a,p)&&clear(p,b))return[p,b]}return[]}

   const baseStyle=getComputedStyle(baseCat);
   const presets={
    1:{asset:null,ratio:'50/44'},
    2:{asset:'assets/cats/cat_2_black_walk.webp',ratio:'15/14'},
    3:{asset:'assets/cats/cat_3_white_walk.webp',ratio:'60/53'}
   };
   const behaviors=[
    {behavior:'SIT',emoji:'🛋️',spot:{x:31.5,y:53.5},duration:[3200,5200]},
    {behavior:'SLEEP',emoji:'💤',spot:{x:61.5,y:68.5},duration:[4200,6500]},
    {behavior:'STUDY',emoji:'📚',spot:{x:58.5,y:82},duration:[3600,5800]}
   ];
   let cats=[];

   const hud=d.createElement('div');Object.assign(hud.style,{position:'absolute',left:'50%',top:'3%',transform:'translateX(-50%)',zIndex:'320',padding:'7px 12px',border:'2px solid #704323',borderRadius:'16px',background:'#fff2ddef',fontWeight:'900',boxShadow:'0 6px 18px #0003'});hud.textContent='🐾 DB 멀티고양이 · 사용자 UUID를 불러오세요';stage.append(hud);

   function clearCats(){for(const c of cats){c.el.remove();c.label.remove()}cats=[]}
   function spawn(dbCats){clearCats();
    if(!dbCats.length){hud.textContent='🐾 DB 보유 고양이 0마리';return}
    dbCats.forEach((dbCat,index)=>{
      const visual=presets[Number(dbCat.cat_id)]||presets[1];
      const behavior={...behaviors[index%behaviors.length]};
      let pos=null;for(let i=0;i<300;i++){const p={x:22+Math.random()*55,y:46+Math.random()*37};if(walkable(p)&&safeFromCats(p,null,cats,8)){pos=p;break}}if(!pos)pos={x:50,y:72};
      const el=d.createElement('div');el.className='dbLifeCat';Object.assign(el.style,{position:'absolute',left:pos.x+'%',top:pos.y+'%',width:'10.5%',aspectRatio:visual.ratio,transform:'translate(-50%,-72%)',transformOrigin:'50% 82%',zIndex:'150',pointerEvents:'auto',cursor:'pointer',filter:'drop-shadow(0 5px 4px #4b2d1870)',backgroundRepeat:'no-repeat',backgroundSize:'500% 100%',backgroundPosition:'0% 0%',willChange:'left,top,transform'});el.style.backgroundImage=visual.asset?`url("${visual.asset}")`:baseStyle.backgroundImage;stage.append(el);
      const label=d.createElement('div');Object.assign(label.style,{position:'absolute',fontSize:'11px',fontWeight:'900',padding:'2px 6px',borderRadius:'999px',background:'#fff6dcdd',border:'1px solid #7b4b28',zIndex:'250',pointerEvents:'none',transform:'translate(-50%,-50%)'});stage.append(label);
      const c={dbCat,...visual,...behavior,el,label,pos:{...pos},target:{...pos},path:[],pi:0,state:'IDLE',frame:0,lastFrame:0,nextMove:performance.now()+900+Math.random()*1800,flip:1,actionUntil:0,actionCycle:0};cats.push(c);labelCat(c);render(c);el.addEventListener('click',e=>{e.stopPropagation();c.label.textContent=`${dbCat.name||'고양이'} ❤️`;el.animate([{filter:el.style.filter},{filter:'brightness(1.35) drop-shadow(0 5px 4px #4b2d1870)'},{filter:el.style.filter}],{duration:420});setTimeout(()=>labelCat(c),700)})
    });
    hud.textContent=`🐾 DB 보유 고양이 ${cats.length}마리 · 산책 + 생활 행동`;
   }

   function labelCat(c){const icon=c.state===c.behavior?c.emoji:c.state==='WALK'?'🐾':'😺';const rarity=c.dbCat.rarity?` · ${c.dbCat.rarity}`:'';c.label.textContent=`${c.dbCat.name||'고양이'}${rarity} ${icon} ${c.state}`}
   function setWalk(c,target,after){const path=detour(c.pos,target);if(!path.length){c.nextMove=performance.now()+1200;return false}c.target={...target};c.path=path;c.pi=0;c.state='WALK';c.afterWalk=after||'IDLE';c.flip=(path[0].x<c.pos.x)?-1:1;labelCat(c);return true}
   function choose(c){c.actionCycle++;const doFurniture=c.actionCycle%2===1;if(doFurniture&&safeFromCats(c.spot,c,cats,6)){if(setWalk(c,c.spot,c.behavior))return}setWalk(c,randomPoint(c,cats),'IDLE')}
   function enterAction(c,now){c.state=c.behavior;c.frame=0;c.el.style.backgroundPosition='0% 0%';const [a,b]=c.duration;c.actionUntil=now+a+Math.random()*(b-a);c.el.animate(c.behavior==='SLEEP'?[{transform:c.el.style.transform,opacity:1},{transform:c.el.style.transform+' scale(.96,.92)',opacity:.88},{transform:c.el.style.transform,opacity:1}]:c.behavior==='SIT'?[{transform:c.el.style.transform},{transform:c.el.style.transform+' translateY(3px) scale(1,.94)'},{transform:c.el.style.transform}]:[{transform:c.el.style.transform},{transform:c.el.style.transform+' rotate(-2deg)'},{transform:c.el.style.transform+' rotate(2deg)'},{transform:c.el.style.transform}],{duration:1100,iterations:3});labelCat(c)}
   function finishWalk(c,now){c.pos={...c.target};c.path=[];c.pi=0;c.frame=0;c.el.style.backgroundPosition='0% 0%';if(c.afterWalk===c.behavior)enterAction(c,now);else{c.state='IDLE';c.nextMove=now+1800+Math.random()*3500;labelCat(c)}}
   function render(c){const depth=.82+Math.max(0,Math.min(1,(c.pos.y-43)/46))*.3;c.el.style.left=c.pos.x+'%';c.el.style.top=c.pos.y+'%';c.el.style.transform=`translate(-50%,-72%) scale(${c.flip},${depth})`;c.el.style.zIndex=String(150+Math.round(c.pos.y));c.label.style.left=c.pos.x+'%';c.label.style.top=(c.pos.y-6)+'%';c.label.style.zIndex=String(260+Math.round(c.pos.y))}

   async function loadDbCats(){const uid=(userInput&&userInput.value.trim())||localStorage.getItem('catGameApiUserId')||'';if(!uid){clearCats();hud.textContent='🐾 사용자 UUID를 입력하세요';return}hud.textContent='🐾 DB 고양이 불러오는 중…';try{const r=await fetch(API+'/users/'+encodeURIComponent(uid)+'/cats');const data=await r.json().catch(()=>[]);if(!r.ok){clearCats();hud.textContent=`🐾 고양이 조회 실패 ${r.status}`;return}spawn(Array.isArray(data)?data:[])}catch(e){clearCats();hud.textContent='🐾 FastAPI 연결 실패'}}
   if(loadBtn)loadBtn.addEventListener('click',()=>setTimeout(loadDbCats,120));
   if(userInput)userInput.addEventListener('change',()=>setTimeout(loadDbCats,80));
   if((userInput&&userInput.value.trim())||localStorage.getItem('catGameApiUserId'))loadDbCats();

   let last=performance.now();
   function tick(now){const dt=Math.min(40,now-last)/1000;last=now;for(const c of cats){if(c.state===c.behavior&&now>=c.actionUntil){c.state='IDLE';c.nextMove=now+900+Math.random()*1500;labelCat(c)}if(c.state==='IDLE'&&now>=c.nextMove)choose(c);if(c.state==='WALK'){const n=c.path[c.pi]||c.target,dx=n.x-c.pos.x,dy=n.y-c.pos.y,dist=Math.hypot(dx*1.7,dy);if(dist<.35){c.pos={x:n.x,y:n.y};if(c.pi<c.path.length-1){c.pi++;c.flip=c.path[c.pi].x<c.pos.x?-1:1}else finishWalk(c,now)}else{const speed=9.1,norm=Math.hypot(dx*1.7,dy)||1;const np={x:c.pos.x+dx/norm*speed*dt,y:c.pos.y+dy/norm*speed*dt};if(safeFromCats(np,c,cats,4.8))c.pos=np;else{c.state='IDLE';c.nextMove=now+650+Math.random()*900;labelCat(c)}if(now-c.lastFrame>110){c.frame=(c.frame+1)%5;c.el.style.backgroundPosition=(c.frame*25)+'% 0%';c.lastFrame=now}}}render(c)}requestAnimationFrame(tick)}
   requestAnimationFrame(tick);
  }catch(err){console.error(err)}
 });
})();
</script>
</body>
</html>
