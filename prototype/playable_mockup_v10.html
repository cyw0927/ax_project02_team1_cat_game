<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Game Playable Mockup v10 - Multi Cat House</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2d241d}#game{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="game" src="playable_mockup_v9.html" title="Cat Game Playable Prototype v10"></iframe>
<script>
(()=>{
 const frame=document.getElementById('game');
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 async function until(fn,limit=20000){const t=performance.now();while(performance.now()-t<limit){const v=fn();if(v)return v;await wait(60)}throw new Error('v10 init timeout')}
 frame.addEventListener('load',async()=>{
  try{
   const d9=frame.contentDocument;
   let cur=d9;
   for(let i=0;i<7;i++){const f=await until(()=>cur&&cur.getElementById('game'));cur=f.contentDocument}
   const d=cur;
   const stage=await until(()=>d&&d.getElementById('stage'));
   const baseCat=d.getElementById('catV2');
   if(!stage||!baseCat)return;

   baseCat.style.display='none';
   const P=[{x:15.5,y:61.5},{x:34,y:43},{x:49,y:37},{x:72,y:43.5},{x:82,y:59},{x:81,y:65},{x:50,y:91},{x:15,y:65}];
   const O=[[18,54,30,64.5],[34,43,48,52],[31,51,37,59],[45,54,57,62],[46,33,55,41],[58,42,67,50],[67,48,74,55],[65,56,80,69],[41,76,55,88],[38,57,44,66],[55,64,63,73]];
   const pad={x:.8,y:1};
   function pip(p){let z=false;for(let i=0,j=P.length-1;i<P.length;j=i++)if(((P[i].y>p.y)!=(P[j].y>p.y))&&(p.x<(P[j].x-P[i].x)*(p.y-P[i].y)/((P[j].y-P[i].y)||1e-9)+P[i].x))z=!z;return z}
   function walkable(p){return pip(p)&&!O.some(o=>p.x>=o[0]-pad.x&&p.x<=o[2]+pad.x&&p.y>=o[1]-pad.y&&p.y<=o[3]+pad.y)}
   function safeFromCats(p,self,cats,min=7){return cats.every(c=>c===self||Math.hypot((c.pos.x-p.x)*1.6,c.pos.y-p.y)>=min)}
   function randomPoint(self,cats){for(let i=0;i<500;i++){const p={x:16+Math.random()*65,y:39+Math.random()*50};if(walkable(p)&&safeFromCats(p,self,cats,8))return p}return{x:50,y:72}}
   function clear(a,b){const m=Math.max(3,Math.ceil(Math.hypot((a.x-b.x)*1.7,a.y-b.y)*1.2));for(let i=0;i<=m;i++){const t=i/m;if(!walkable({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}))return false}return true}
   function detour(a,b){if(clear(a,b))return[b];const mids=[];for(let i=0;i<160;i++){const p={x:16+Math.random()*65,y:39+Math.random()*50};if(walkable(p)&&clear(a,p)&&clear(p,b)){mids.push(p);break}}return mids.length?[...mids,b]:[]}

   const defs=[
    {id:1,name:'주황',pos:{x:61,y:76},asset:null,ratio:'50/44'},
    {id:2,name:'검정',pos:{x:32,y:68},asset:'assets/cats/cat_2_black_walk.webp',ratio:'15/14'},
    {id:3,name:'흰색',pos:{x:72,y:52},asset:'assets/cats/cat_3_white_walk.webp',ratio:'60/53'}
   ];
   const baseStyle=getComputedStyle(baseCat);
   const cats=defs.map(def=>{
     const el=d.createElement('div');
     el.className='multiCat';
     Object.assign(el.style,{position:'absolute',left:def.pos.x+'%',top:def.pos.y+'%',width:'10.5%',aspectRatio:def.ratio,transform:'translate(-50%,-72%)',transformOrigin:'50% 82%',zIndex:'150',pointerEvents:'auto',cursor:'pointer',filter:'drop-shadow(0 5px 4px #4b2d1870)',backgroundRepeat:'no-repeat',backgroundSize:'500% 100%',backgroundPosition:'0% 0%',willChange:'left,top,transform'});
     el.style.backgroundImage=def.asset?`url("${def.asset}")`:baseStyle.backgroundImage;
     stage.append(el);
     const label=d.createElement('div');label.textContent=def.name;Object.assign(label.style,{position:'absolute',fontSize:'11px',fontWeight:'900',padding:'2px 6px',borderRadius:'999px',background:'#fff6dcdd',border:'1px solid #7b4b28',zIndex:'250',pointerEvents:'none',transform:'translate(-50%,-50%)'});stage.append(label);
     return{...def,el,label,pos:{...def.pos},target:{...def.pos},path:[],pi:0,state:'IDLE',frame:0,lastFrame:0,nextMove:performance.now()+1200+Math.random()*2200,flip:1};
   });

   const hud=d.createElement('div');Object.assign(hud.style,{position:'absolute',left:'50%',top:'3%',transform:'translateX(-50%)',zIndex:'300',padding:'7px 12px',border:'2px solid #704323',borderRadius:'16px',background:'#fff2ddef',fontWeight:'900',boxShadow:'0 6px 18px #0003'});hud.textContent='🐾 멀티고양이 생활모드 · 3마리 동시 산책';stage.append(hud);

   function plan(c){const p=randomPoint(c,cats);const path=detour(c.pos,p);if(!path.length){c.nextMove=performance.now()+1800;return}c.target=p;c.path=path;c.pi=0;c.state='WALK';c.flip=(path[0].x<c.pos.x)?-1:1}
   function render(c){const depth=.82+Math.max(0,Math.min(1,(c.pos.y-43)/46))*.3;c.el.style.left=c.pos.x+'%';c.el.style.top=c.pos.y+'%';c.el.style.transform=`translate(-50%,-72%) scale(${c.flip},${depth})`;c.el.style.zIndex=String(150+Math.round(c.pos.y));c.label.style.left=c.pos.x+'%';c.label.style.top=(c.pos.y-6)+'%';c.label.style.zIndex=String(260+Math.round(c.pos.y))}
   function finish(c,now){c.pos={...c.target};c.path=[];c.pi=0;c.state='IDLE';c.frame=0;c.el.style.backgroundPosition='0% 0%';c.nextMove=now+2500+Math.random()*5500}
   let last=performance.now();
   function tick(now){const dt=Math.min(40,now-last)/1000;last=now;for(const c of cats){if(c.state==='IDLE'&&now>=c.nextMove)plan(c);if(c.state==='WALK'){const n=c.path[c.pi]||c.target;const dx=n.x-c.pos.x,dy=n.y-c.pos.y,dist=Math.hypot(dx*1.7,dy);if(dist<.35){c.pos={x:n.x,y:n.y};if(c.pi<c.path.length-1){c.pi++;c.flip=c.path[c.pi].x<c.pos.x?-1:1}else finish(c,now)}else{const step=9.5,norm=Math.hypot(dx*1.7,dy)||1;const np={x:c.pos.x+dx/norm*step*dt,y:c.pos.y+dy/norm*step*dt};if(safeFromCats(np,c,cats,4.8)){c.pos=np}else{c.state='IDLE';c.nextMove=now+700+Math.random()*900}if(now-c.lastFrame>110){c.frame=(c.frame+1)%5;c.el.style.backgroundPosition=(c.frame*25)+'% 0%';c.lastFrame=now}}}render(c)}requestAnimationFrame(tick)}
   cats.forEach(c=>{c.el.addEventListener('click',e=>{e.stopPropagation();c.label.textContent=c.name+' 😺';c.el.animate([{transform:c.el.style.transform},{transform:c.el.style.transform+' translateY(-8px)'},{transform:c.el.style.transform}],{duration:380});setTimeout(()=>c.label.textContent=c.name,700)});render(c)});
   requestAnimationFrame(tick);
  }catch(err){console.error(err)}
 });
})();
</script>
</body>
</html>
