<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Game Playable Mockup v7 - Cat Sprite Asset Mapping</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2d241d}#game{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="game" src="playable_mockup_v6.html" title="Cat Game Playable Prototype v7"></iframe>
<script>
(()=>{
 const API='http://127.0.0.1:8000';
 const frame=document.getElementById('game');
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 async function until(fn,limit=15000){const t=performance.now();while(performance.now()-t<limit){const v=fn();if(v)return v;await wait(60)}throw new Error('v7 init timeout')}
 frame.addEventListener('load',async()=>{
  try{
   const d6=frame.contentDocument;
   const f5=await until(()=>d6&&d6.getElementById('game'));
   const d5=f5.contentDocument;
   const f4=await until(()=>d5&&d5.getElementById('game'));
   const d4=f4.contentDocument;
   const f3=await until(()=>d4&&d4.getElementById('game'));
   const d3=f3.contentDocument;
   const f2=await until(()=>d3&&d3.getElementById('game'));
   const d=f2.contentDocument;
   const house=await until(()=>d&&d.getElementById('house'));
   const roster=d.getElementById('rosterList');
   const userInput=d.getElementById('catUser');
   if(!house||!roster||!userInput)return;

   const houseOuter=house.querySelector('iframe');
   const cat=await until(()=>{
     const d4h=houseOuter&&houseOuter.contentDocument;
     const f3h=d4h&&d4h.getElementById('game');
     const d3h=f3h&&f3h.contentDocument;
     const f2h=d3h&&d3h.getElementById('game');
     const d2h=f2h&&f2h.contentDocument;
     const f1h=d2h&&d2h.getElementById('game');
     const d1h=f1h&&f1h.contentDocument;
     return d1h&&d1h.getElementById('catV2');
   });

   const css=d.createElement('style');
   css.textContent=`.spriteAssetState{position:absolute;left:50%;top:14%;z-index:10026;transform:translateX(-50%);padding:5px 10px;border-radius:999px;border:2px solid #7b4b28;background:#fff8e8e8;font-size:11px;font-weight:900;pointer-events:none}.spriteAssetState.fallback{opacity:.75}`;
   d.head.append(css);
   const assetBadge=d.createElement('div');assetBadge.className='spriteAssetState fallback';assetBadge.textContent='sprite: default';house.append(assetBadge);

   let manifest={default:{source:'inherited',label:'default',frames:5},cats:{}};
   const original={
     backgroundImage:cat.style.backgroundImage,
     backgroundSize:cat.style.backgroundSize,
     backgroundRepeat:cat.style.backgroundRepeat,
     backgroundPosition:cat.style.backgroundPosition,
     width:cat.style.width,
     aspectRatio:cat.style.aspectRatio,
     filter:cat.style.filter
   };
   try{
     const r=await fetch('cat_sprite_manifest.json',{cache:'no-store'});
     if(r.ok)manifest=await r.json();
   }catch(e){console.warn('sprite manifest load failed',e)}

   const uid=()=>userInput.value.trim();
   async function fetchSelectedCat(){
     const id=uid(),selectedId=localStorage.getItem('catGameSelectedUserCatId')||'';
     if(!id)return null;
     try{
       const r=await fetch(API+'/users/'+encodeURIComponent(id)+'/cats');
       if(!r.ok)return null;
       const cats=await r.json();
       return cats.find(c=>String(c.user_cat_id)===String(selectedId))||cats[0]||null;
     }catch{return null}
   }
   function resetDefault(){
     cat.style.backgroundImage=original.backgroundImage;
     cat.style.backgroundSize=original.backgroundSize;
     cat.style.backgroundRepeat=original.backgroundRepeat;
     cat.style.backgroundPosition=original.backgroundPosition;
     cat.style.width=original.width;
     cat.style.aspectRatio=original.aspectRatio;
     cat.style.filter=original.filter;
   }
   function applyAsset(dbCat){
     if(!dbCat){resetDefault();assetBadge.textContent='sprite: default · DB 고양이 없음';assetBadge.classList.add('fallback');return}
     const specific=manifest.cats&&manifest.cats[String(dbCat.cat_id)];
     const asset=specific||manifest.default||{source:'inherited'};
     resetDefault();
     if(asset.filter)cat.style.filter=asset.filter;
     if(asset.source==='inherited'||!asset.url){
       assetBadge.textContent=`sprite: ${asset.label||'default'} · cat_id=${dbCat.cat_id}`;
       assetBadge.classList.toggle('fallback',!specific);
       return;
     }
     const frames=Math.max(1,Number(asset.frames||1));
     cat.style.backgroundImage=`url("${asset.url}")`;
     cat.style.backgroundRepeat='no-repeat';
     cat.style.backgroundSize=asset.layout==='vertical'?`100% ${frames*100}%`:`${frames*100}% 100%`;
     cat.style.backgroundPosition='0 0';
     if(asset.width)cat.style.width=asset.width;
     if(asset.aspectRatio)cat.style.aspectRatio=asset.aspectRatio;
     assetBadge.textContent=`sprite: ${asset.label||asset.url} · cat_id=${dbCat.cat_id}`;
     assetBadge.classList.remove('fallback');
   }
   async function refreshAsset(){applyAsset(await fetchSelectedCat())}

   roster.addEventListener('click',e=>{if(e.target.closest('[data-user-cat]'))setTimeout(refreshAsset,80)});
   userInput.addEventListener('change',()=>setTimeout(refreshAsset,80));
   const loadBtn=d.getElementById('catLoad');if(loadBtn)loadBtn.addEventListener('click',()=>setTimeout(refreshAsset,250));
   addEventListener('storage',e=>{if(e.key==='catGameSelectedUserCatId')refreshAsset()});
   await refreshAsset();
  }catch(err){console.error(err)}
 });
})();
</script>
</body>
</html>
