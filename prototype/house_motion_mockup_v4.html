<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat House Interaction Prototype v4</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2d241d}#game{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="game" src="house_motion_mockup_v3.html" title="하우스 가구 상호작용 프로토타입"></iframe>
<script>
(()=>{
  const root=document.getElementById('game');
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const waitFor=async(fn,limit=12000)=>{
    const start=performance.now();
    while(performance.now()-start<limit){const v=fn();if(v)return v;await sleep(60)}
    throw new Error('prototype init timeout');
  };
  root.addEventListener('load',async()=>{
    try{
      const ctx=await waitFor(()=>{
        const d3=root.contentDocument;
        const f2=d3&&d3.getElementById('game');
        const d2=f2&&f2.contentDocument;
        const f1=d2&&d2.getElementById('game');
        const d=f1&&f1.contentDocument;
        const stage=d&&d.getElementById('stage');
        const cat=d&&d.getElementById('catV2');
        const state=d&&d.getElementById('stateText');
        return stage&&cat&&state?{d,stage,cat,state}:null;
      });
      const {d,stage,cat,state}=ctx;
      const panel=d.getElementById('panel');
      const badge=d.getElementById('badge');
      const debug=d.getElementById('debug');
      if(!panel||!badge)return;

      const css=d.createElement('style');
      css.textContent=`
        .v4-hotspot{position:absolute;z-index:95;border:2px dashed #8b5626;background:#fff1cfcc;color:#5b351b;border-radius:999px;padding:5px 9px;font-weight:900;font-size:clamp(9px,.86vw,13px);cursor:pointer;box-shadow:0 3px 10px #0002;transform:translate(-50%,-50%);white-space:nowrap}
        .v4-hotspot:hover{background:#ffd98f;transform:translate(-50%,-50%) scale(1.05)}
        .v4-bubble{position:absolute;z-index:130;min-width:120px;max-width:230px;padding:10px 14px;border:3px solid #6f4326;border-radius:18px;background:#fff9e9;color:#4b2d18;font-weight:900;text-align:center;box-shadow:0 8px 22px #0003;opacity:0;transform:translate(-50%,-115%) scale(.9);transition:.18s ease;pointer-events:none}
        .v4-bubble.show{opacity:1;transform:translate(-50%,-125%) scale(1)}
        .v4-action{position:absolute;z-index:125;pointer-events:none;font-size:clamp(26px,3vw,48px);filter:drop-shadow(0 4px 3px #0004);opacity:0;transform:translate(-50%,-50%) scale(.7)}
        .v4-action.show{animation:v4pop 1.8s ease both}@keyframes v4pop{0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}20%,75%{opacity:1;transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-95%) scale(.8)}}
      `;
      d.head.append(css);

      const mode=d.createElement('b');mode.textContent='FREE';
      if(debug)debug.append(' · interaction: ',mode);

      const bubble=d.createElement('div');bubble.className='v4-bubble';stage.append(bubble);
      const actionIcon=d.createElement('div');actionIcon.className='v4-action';stage.append(actionIcon);

      const interactions=[
        {id:'sofa',label:'🛋 소파',hot:[40,47],go:[39,55],type:'SIT',icon:'🛋️',say:'폭신하다냥… 잠깐 쉴래!'},
        {id:'bed',label:'🛏 침대',hot:[73,61],go:[68,72],type:'SLEEP',icon:'💤',say:'졸리다냥… 5분만 잘게…'},
        {id:'study',label:'📚 공부',hot:[50,58],go:[48,68],type:'STUDY',icon:'📖',say:'파이썬 한 문제만 더 풀자냥!'}
      ];

      let busy=false,seq=0;
      const makeHotspot=o=>{
        const b=d.createElement('button');b.className='v4-hotspot';b.textContent=o.label;b.dataset.id=o.id;
        b.style.left=o.hot[0]+'%';b.style.top=o.hot[1]+'%';stage.append(b);
        b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();runInteraction(o)});
        b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()});
        return b;
      };
      const hotspots=interactions.map(makeHotspot);

      function showBubble(text,ms=1800){
        const r=cat.getBoundingClientRect(),sr=stage.getBoundingClientRect();
        bubble.textContent=text;
        bubble.style.left=((r.left+r.width/2-sr.left)/sr.width*100)+'%';
        bubble.style.top=((r.top-sr.top)/sr.height*100)+'%';
        bubble.classList.add('show');
        setTimeout(()=>bubble.classList.remove('show'),ms);
      }
      function showIcon(icon){
        const r=cat.getBoundingClientRect(),sr=stage.getBoundingClientRect();
        actionIcon.textContent=icon;actionIcon.style.left=((r.left+r.width/2-sr.left)/sr.width*100)+'%';actionIcon.style.top=((r.top-sr.top)/sr.height*100-4)+'%';
        actionIcon.classList.remove('show');void actionIcon.offsetWidth;actionIcon.classList.add('show');
      }
      function dispatchMove(point){
        const r=stage.getBoundingClientRect();
        stage.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,clientX:r.left+r.width*point[0]/100,clientY:r.top+r.height*point[1]/100,pointerId:22,pointerType:'mouse'}));
      }
      async function waitUntilIdle(token){
        let sawWalk=false;const start=performance.now();
        while(performance.now()-start<9000){
          if(token!==seq)return false;
          if(state.textContent==='WALK')sawWalk=true;
          if(sawWalk&&state.textContent==='IDLE')return true;
          await sleep(80);
        }
        return state.textContent==='IDLE';
      }
      function setHotspots(on){hotspots.forEach(h=>h.disabled=!on);hotspots.forEach(h=>h.style.opacity=on?'1':'.45')}
      async function pose(type,token){
        mode.textContent=type;showIcon(type==='SIT'?'🛋️':type==='SLEEP'?'💤':'📖');
        const baseTransform=cat.style.transform;
        if(type==='SIT'){
          const a=cat.animate([{transform:baseTransform},{transform:baseTransform+' scaleY(.86) translateY(6%)'},{transform:baseTransform+' scaleY(.86) translateY(6%)'}],{duration:2100,easing:'ease-out'});await a.finished.catch(()=>{});
        }else if(type==='SLEEP'){
          const a=cat.animate([{transform:baseTransform},{transform:baseTransform+' rotate(-8deg) scaleY(.78) translateY(10%)'},{transform:baseTransform+' rotate(-8deg) scaleY(.78) translateY(10%)'}],{duration:2700,easing:'ease-in-out'});await a.finished.catch(()=>{});
        }else if(type==='STUDY'){
          const a=cat.animate([{transform:baseTransform},{transform:baseTransform+' translateY(1%)'},{transform:baseTransform+' translateY(-1%)'},{transform:baseTransform}],{duration:560,iterations:4,easing:'ease-in-out'});await a.finished.catch(()=>{});
        }
        if(token===seq){cat.style.transform=baseTransform;mode.textContent='FREE'}
      }
      async function runInteraction(o){
        if(busy)return;busy=true;const token=++seq;setHotspots(false);mode.textContent='MOVING';bubble.classList.remove('show');
        dispatchMove(o.go);
        const arrived=await waitUntilIdle(token);
        if(!arrived||token!==seq){busy=false;setHotspots(true);mode.textContent='FREE';return}
        showBubble(o.say,2100);
        await pose(o.type,token);
        busy=false;setHotspots(true);mode.textContent='FREE';
      }

      cat.style.pointerEvents='auto';cat.style.cursor='pointer';
      cat.addEventListener('pointerdown',e=>{
        e.preventDefault();e.stopPropagation();if(busy)return;
        showBubble(['쓰다듬어 달라냥!','오늘도 같이 놀자냥!','문제 하나 풀고 간식 먹자냥!'][Math.floor(Math.random()*3)],1700);
        showIcon('💛');cat.animate([{filter:'brightness(1)'},{filter:'brightness(1.3)'},{filter:'brightness(1)'}],{duration:420});
      });
      badge.textContent='가구를 눌러보세요: 소파→앉기 · 침대→자기 · 공부→책 보기 · 고양이→반응 🐾';
    }catch(err){console.error(err)}
  });
})();
</script>
</body>
</html>
