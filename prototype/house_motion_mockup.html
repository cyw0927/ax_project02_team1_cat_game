yId('wanderBtn'),homeBtn=document.getElementById('homeBtn');const bounds={minX:33,maxX:76,minY:47,maxY:72};let pos={x:45,y:59},target={...pos},state='IDLE',frame=0,lastFrame=0,lastTick=performance.now(),wanderTimer=null,flip=1;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function setState(s){if(state===s)return;state=s;stateText.textContent=s;if(s==='IDLE'){frame=0;cat.style.backgroundPosition='0% 0'}}function setTarget(x,y){target.x=clamp(x,bounds.minX,bounds.maxX);target.y=clamp(y,bounds.minY,bounds.maxY);flip=target.x<pos.x?-1:1;setState('WALK')}function render(){const depth=.82+((pos.y-bounds.minY)/(bounds.maxY-bounds.minY))*.30;cat.style.left=pos.x+'%';cat.style.top=pos.y+'%';cat.style.transform=`translate(-50%,-72%) scale(${flip},${depth})`;cat.style.zIndex=String(10+Math.round(pos.y))}function tick(now){const dt=Math.min(40,now-lastTick)/1000;lastTick=now;if(state==='WALK'){const dx=target.x-pos.x,dy=target.y-pos.y,d=Math.hypot(dx,dy);if(d<.22){pos={...target};setState('IDLE');cat.classList.remove('pulse');void cat.offsetWidth;cat.classList.add('pulse')}else{const speed=11.5;pos.x+=dx/d*speed*dt;pos.y+=dy/d*speed*dt;if(now-lastFrame>105){frame=(frame+1)%5;cat.style.backgroundPosition=(frame*25)+'% 0';lastFrame=now}}}render();requestAnimationFrame(tick)}stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=stage.getBoundingClientRect();setTarget((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)});wanderBtn.addEventListener('click',e=>{e.stopPropagation();if(wanderTimer){clearInterval(wanderTimer);wanderTimer=null;wanderBtn.textContent='랜덤 산책';setState('IDLE');return}const walk=()=>setTarget(bounds.minX+Math.random()*(bounds.maxX-bounds.minX),bounds.minY+Math.random()*(bounds.maxY-bounds.minY));walk();wanderTimer=setInterval(walk,2600);wanderBtn.textContent='산책 중지'});homeBtn.addEventListener('click',e=>{e.stopPropagation();setTarget(50,60)});render();requestAnimationFrame(tick)})();</script></body></html>
