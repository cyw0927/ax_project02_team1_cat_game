<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Game Playable Mockup v4 - FastAPI Shop Bridge</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2d241d}#game{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="game" src="playable_mockup_v3.html" title="Cat Game Playable Prototype v4"></iframe>
<script>
(()=>{
 const API='http://127.0.0.1:8000';
 const frame=document.getElementById('game');
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 async function until(fn,limit=12000){const t=performance.now();while(performance.now()-t<limit){const v=fn();if(v)return v;await wait(50)}throw new Error('v4 init timeout')}
 frame.addEventListener('load',async()=>{
  try{
   const d3=frame.contentDocument;
   const v2frame=await until(()=>d3&&d3.getElementById('game'));
   const d=v2frame.contentDocument;
   const app=await until(()=>d&&d.getElementById('app'));
   const home=d.getElementById('home'),nav=home&&home.querySelector('.nav');
   if(!app||!nav)return;

   const shopBtn=d.createElement('button');shopBtn.dataset.go='shop';shopBtn.innerHTML='🛒<br>Shop';nav.insertBefore(shopBtn,nav.querySelector('[data-go="house"]'));

   const shop=d.createElement('section');shop.id='shop';shop.className='screen page';
   shop.innerHTML=`
    <button class="back" data-go="home">← 홈</button>
    <div class="card" style="max-height:82%;overflow:auto">
      <h1>상점 <small>(실제 FastAPI)</small></h1>
      <p>DB에 존재하는 사용자 UUID를 입력하면 실제 아이템 목록과 구매 API를 사용합니다.</p>
      <label>실제 사용자 UUID
        <input id="shopUser" placeholder="DB user UUID" style="width:100%;padding:8px;margin:6px 0 10px">
      </label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="shopReload" class="tiny">아이템 불러오기</button>
        <button id="invReload" class="tiny">내 인벤토리</button>
        <span id="shopState">대기 중</span>
      </div>
      <div id="shopBalance" style="margin:10px 0;font-weight:900"></div>
      <div id="shopItems" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px"></div>
      <h3 style="margin-top:18px">내 인벤토리</h3>
      <div id="shopInventory" class="muted">아직 조회하지 않았습니다.</div>
      <p class="muted">이 화면의 구매는 DEMO가 아니라 실제 `POST /shop/buy`를 호출합니다. 홈의 DEMO 사료 숫자와는 별개입니다.</p>
    </div>`;
   app.insertBefore(shop,d.getElementById('toast'));

   const user=shop.querySelector('#shopUser'),status=shop.querySelector('#shopState'),itemsBox=shop.querySelector('#shopItems'),invBox=shop.querySelector('#shopInventory'),balance=shop.querySelector('#shopBalance');
   user.value=localStorage.getItem('catGameApiUserId')||'';
   user.addEventListener('change',()=>localStorage.setItem('catGameApiUserId',user.value.trim()));

   function uid(){return user.value.trim()}
   function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
   async function loadItems(){
    status.textContent='아이템 불러오는 중…';itemsBox.innerHTML='';
    try{
      const res=await fetch(API+'/items');if(!res.ok)throw new Error('/items '+res.status);
      const items=await res.json();status.textContent='🟢 실제 아이템 '+items.length+'개';
      if(!items.length){itemsBox.textContent='등록된 아이템이 없습니다.';return}
      for(const item of items){
       const box=d.createElement('div');box.style.cssText='padding:12px;border:2px solid #b27b4e;border-radius:15px;background:#fffaf0';
       box.innerHTML=`<b>${safe(item.name)}</b><div class="muted">${safe(item.category)} · ID ${item.id}</div><div style="font-size:20px;font-weight:950;margin:6px 0">🥣 ${Number(item.price).toLocaleString()}</div><button class="tiny" data-buy="${item.id}">실제 구매</button>`;
       itemsBox.append(box);
      }
    }catch(err){status.textContent='🔴 FastAPI 상점 연결 실패';itemsBox.textContent=err.message}
   }
   async function loadInventory(){
    const id=uid();if(!id){invBox.textContent='사용자 UUID를 먼저 입력하세요.';return}
    invBox.textContent='조회 중…';
    try{
      const res=await fetch(API+'/users/'+encodeURIComponent(id)+'/inventory');const data=await res.json().catch(()=>[]);
      if(!res.ok){invBox.textContent=`오류 ${res.status}: ${data.detail||'조회 실패'}`;return}
      invBox.innerHTML=data.length?data.map(x=>`<div>📦 ${safe(x.name)} × ${x.quantity} <span class="muted">(${safe(x.category)})</span></div>`).join(''):'보유 아이템이 없습니다.';
    }catch(err){invBox.textContent='연결 실패: '+err.message}
   }
   async function buy(itemId,btn){
    const id=uid();if(!id){status.textContent='실제 사용자 UUID를 먼저 입력하세요.';return}
    btn.disabled=true;status.textContent='구매 처리 중…';
    try{
      const res=await fetch(API+'/shop/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,item_id:Number(itemId)})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok){status.textContent=`구매 실패 ${res.status}: ${data.detail||'요청 실패'}`;return}
      status.textContent=`✅ ${data.item_name} 구매 완료 · 보유 ${data.quantity}개`;
      balance.textContent='실제 DB 잔액: 🥣 '+Number(data.current_balance).toLocaleString();
      await loadInventory();
    }catch(err){status.textContent='구매 연결 실패: '+err.message}
    finally{btn.disabled=false}
   }
   shop.querySelector('#shopReload').addEventListener('click',e=>{e.preventDefault();loadItems()});
   shop.querySelector('#invReload').addEventListener('click',e=>{e.preventDefault();loadInventory()});
   itemsBox.addEventListener('click',e=>{const b=e.target.closest('[data-buy]');if(b){e.preventDefault();buy(b.dataset.buy,b)}});
   loadItems();
  }catch(err){console.error(err)}
 });
})();
</script>
</body>
</html>
