<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat House Motion Prototype v2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2d241d}#game{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="house_motion_mockup.html" title="하우스 이동 프로토타입"></iframe><script>
(()=>{const f=document.getElementById('game');f.addEventListener('load',()=>{const d=f.contentDocument,w=f.contentWindow,stage=d.getElementById('stage'),oldCat=d.getElementById('cat'),oldW=d.getElementById('wanderBtn'),oldH=d.getElementById('homeBtn'),panel=d.getElementById('panel'),debug=d.getElementById('debug'),stateText=d.getElementById('stateText'),badge=d.getElementById('badge');if(!stage||!oldCat)return;const sprite=w.getComputedStyle(oldCat).backgroundImage;oldCat.style.display='none';badge.textContent='방 바닥을 클릭해보세요 · 가구는 피해 갑니다 🐾';const wb=oldW.cloneNode(true),hb=oldH.cloneNode(true);oldW.replaceWith(wb);oldH.replaceWith(hb);hb.textContent='안전 지점';const pathText=d.createElement('b');pathText.textContent='0';debug.append(' · path: ',pathText);const db=d.createElement('button');db.textContent='이동영역 보기';panel.append(db);const cv=d.createElement('canvas');Object.assign(cv.style,{position:'absolute',inset:'0',width:'100%',height:'100%',zIndex:'55',pointerEvents:'none',display:'none'});stage.prepend(cv);const dot=d.createElement('div');Object.assign(dot.style,{position:'absolute',width:'1.1%',aspectRatio:'1',borderRadius:'50%',background:'#ffe36a',border:'2px solid #7b4a18',boxShadow:'0 0 0 5px #fff8',zIndex:'56',pointerEvents:'none',opacity:'0',transform:'translate(-50%,-50%)'});stage.append(dot);const cat=d.createElement('div');cat.id='catV2';Object.assign(cat.style,{position:'absolute',left:'60%',top:'77%',width:'11%',aspectRatio:'50/44',transform:'translate(-50%,-72%)',transformOrigin:'50% 82%',filter:'drop-shadow(0 6px 5px #4b2d1888)',zIndex:'70',pointerEvents:'none',willChange:'left,top,transform',backgroundImage:sprite,backgroundSize:'500% 100%',backgroundRepeat:'no-repeat',backgroundPosition:'0 0'});stage.append(cat);const P=[{x:15.5,y:61.5},{x:34,y:43},{x:49,y:37},{x:72,y:43.5},{x:82,y:59},{x:81,y:65},{x:50,y:91},{x:15,y:65}],O=[['left_cat_tower',18,54,30,64.5],['sofa',34,43,48,52],['left_drawer',31,51,37,59],['coffee_table',45,54,57,62],['top_cat_tree',46,33,55,41],['tv_console',58,42,67,50],['right_drawer',67,48,74,55],['bed',65,56,80,69],['kitchen_island',41,76,55,88],['painted_orange_cat',38,57,44,66],['painted_black_cat',55,64,63,73]],G={c:56,r:32},pad={x:.6,y:.8};let pos={x:60,y:77},target={...pos},state='IDLE',frame=0,lastFrame=0,lastTick=performance.now(),timer=null,path=[],wi=0,flip=1,show=false;function pip(p){let z=false;for(let i=0,j=P.length-1;i<P.length;j=i++)if(((P[i].y>p.y)!=(P[j].y>p.y))&&(p.x<(P[j].x-P[i].x)*(p.y-P[i].y)/((P[j].y-P[i].y)||1e-9)+P[i].x))z=!z;return z}function walk(p){return pip(p)&&!O.some(o=>p.x>=o[1]-pad.x&&p.x<=o[3]+pad.x&&p.y>=o[2]-pad.y&&p.y<=o[4]+pad.y)}function np(c,r){return{x:c/(G.c-1)*100,y:r/(G.r-1)*100,c,r}}function near(p){let b=null,bd=1e9;for(let r=0;r<G.r;r++)for(let c=0;c<G.c;c++){const n=np(c,r);if(!walk(n))continue;const q=Math.hypot((n.x-p.x)*1.75,n.y-p.y);if(q<bd)bd=q,b=n}return b}function ns(n){const a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dc&&!dr)continue;const c=n.c+dc,r=n.r+dr;if(c<0||r<0||c>=G.c||r>=G.r)continue;const q=np(c,r);if(!walk(q))continue;if(dc&&dr&&(!walk(np(n.c+dc,n.r))||!walk(np(n.c,n.r+dr))))continue;a.push(q)}return a}const k=n=>n.c+','+n.r,h=(a,b)=>Math.hypot((a.x-b.x)*1.75,a.y-b.y);function astar(s,g){if(!s||!g)return[];const op=new Map([[k(s),s]]),came=new Map(),gs=new Map([[k(s),0]]),fs=new Map([[k(s),h(s,g)]]);while(op.size){let cur,ck,cf=1e9;for(const[t,n]of op){const v=fs.get(t)??1e9;if(v<cf)cf=v,cur=n,ck=t}if(cur.c===g.c&&cur.r===g.r){const a=[cur];let q=ck;while(came.has(q)){const p=came.get(q);a.push(p);q=k(p)}return a.reverse()}op.delete(ck);for(const n of ns(cur)){const nk=k(n),ng=(gs.get(ck)??1e9)+h(cur,n);if(ng<(gs.get(nk)??1e9))came.set(nk,cur),gs.set(nk,ng),fs.set(nk,ng+h(n,g)),op.set(nk,n)}}return[]}function clear(a,b){const m=Math.max(2,Math.ceil(h(a,b)*1.5));for(let i=0;i<=m;i++){const t=i/m;if(!walk({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}))return false}return true}function smooth(a){if(a.length<3)return a;const z=[a[0]];let i=0;while(i<a.length-1){let n=i+1;for(let j=a.length-1;j>i+1;j--)if(clear(a[i],a[j])){n=j;break}z.push(a[n]);i=n}return z}function setState(s){if(state===s)return;state=s;stateText.textContent=s;if(s==='IDLE'){frame=0;cat.style.backgroundPosition='0% 0'}}const ptxt=()=>pathText.textContent=String(Math.max(0,path.length-wi));function plan(x,y){const s=near(pos),g=near({x,y}),raw=astar(s,g);if(!raw.length)return false;path=smooth(raw);wi=Math.min(1,path.length-1);target={x:g.x,y:g.y};dot.style.left=target.x+'%';dot.style.top=target.y+'%';dot.style.opacity='1';const n=path[wi]||g;flip=n.x<pos.x?-1:1;setState('WALK');ptxt();draw();return true}function render(){const depth=.82+Math.max(0,Math.min(1,(pos.y-43)/46))*.30;cat.style.left=pos.x+'%';cat.style.top=pos.y+'%';cat.style.transform=`translate(-50%,-72%) scale(${flip},${depth})`;cat.style.zIndex=String(70+Math.round(pos.y))}function done(){pos={...target};path=[];wi=0;ptxt();setState('IDLE');dot.style.opacity='0';cat.animate([{filter:'brightness(1)'},{filter:'brightness(1.25)'},{filter:'brightness(1)'}],{duration:350});draw()}function tick(now){const dt=Math.min(40,now-lastTick)/1000;lastTick=now;if(state==='WALK'){const n=path[wi]||target,dx=n.x-pos.x,dy=n.y-pos.y,dist=Math.hypot(dx*1.75,dy);if(dist<.35){pos={x:n.x,y:n.y};if(wi<path.length-1){wi++;const q=path[wi];flip=q.x<pos.x?-1:1;ptxt()}else done()}else{const sp=12,norm=Math.hypot(dx*1.75,dy)||1;pos.x+=dx/norm*sp*dt;pos.y+=dy/norm*sp*dt;if(now-lastFrame>105){frame=(frame+1)%5;cat.style.backgroundPosition=(frame*25)+'% 0';lastFrame=now}}}render();w.requestAnimationFrame(tick)}function rnd(){for(let i=0;i<300;i++){const p={x:15+Math.random()*68,y:38+Math.random()*53};if(walk(p))return p}return{x:60,y:77}}function draw(){if(!show)return;const r=stage.getBoundingClientRect(),dr=Math.min(2,w.devicePixelRatio||1);cv.width=r.width*dr;cv.height=r.height*dr;const c=cv.getContext('2d');c.scale(dr,dr);const X=x=>x/100*r.width,Y=y=>y/100*r.height;c.clearRect(0,0,r.width,r.height);c.fillStyle='#46dc691f';c.strokeStyle='#146e2de6';c.lineWidth=2;c.beginPath();P.forEach((p,i)=>i?c.lineTo(X(p.x),Y(p.y)):c.moveTo(X(p.x),Y(p.y)));c.closePath();c.fill();c.stroke();c.fillStyle='#ff4b4b2b';c.strokeStyle='#b41e1ed9';for(const o of O){c.fillRect(X(o[1]-pad.x),Y(o[2]-pad.y),X(o[3]-o[1]+2*pad.x),Y(o[4]-o[2]+2*pad.y));c.strokeRect(X(o[1]-pad.x),Y(o[2]-pad.y),X(o[3]-o[1]+2*pad.x),Y(o[4]-o[2]+2*pad.y))}if(path.length){c.strokeStyle='#2766ff';c.lineWidth=4;c.beginPath();c.moveTo(X(pos.x),Y(pos.y));for(let i=wi;i<path.length;i++)c.lineTo(X(path[i].x),Y(path[i].y));c.stroke()}}stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=stage.getBoundingClientRect();plan((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)},true);wb.addEventListener('click',e=>{e.stopPropagation();if(timer){clearInterval(timer);timer=null;wb.textContent='랜덤 산책';path=[];wi=0;ptxt();setState('IDLE');return}const go=()=>{const p=rnd();plan(p.x,p.y)};go();timer=setInterval(go,3600);wb.textContent='산책 중지'});hb.addEventListener('click',e=>{e.stopPropagation();plan(60,77)});db.addEventListener('click',e=>{e.stopPropagation();show=!show;cv.style.display=show?'block':'none';db.textContent=show?'이동영역 숨기기':'이동영역 보기';draw()});w.addEventListener('resize',draw);render();w.requestAnimationFrame(tick)})})();
</script></body></html>
